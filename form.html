<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма студента</title>
    <link rel="icon" type="image/svg+xml" href="assets/cat.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 id="pageTitle">Добавить студента</h1>
        
        <form id="studentForm" novalidate>
            <!-- 1. ФИО -->
            <div class="form-group">
                <label for="fullName">ФИО студента *</label>
                <input type="text" id="fullName" required minlength="3" maxlength="100">
            </div>

            <!-- 2. Группа -->
            <div class="form-group">
                <label for="group">Группа *</label>
                <input type="text" id="group" required>
            </div>

            <!-- 3. ИСУ id (6 digits) -->
            <div class="form-group">
                <label for="isuId">ИСУ ID (ровно 6 цифр) *</label>
                <input type="text" id="isuId" required pattern="\d{6}" maxlength="6">
            </div>

            <!-- 4. Номер общежития -->
            <div class="form-group">
                <label for="dormitoryNumber">Номер общежития *</label>
                <input type="number" id="dormitoryNumber" required min="1" max="99">
            </div>

            <!-- 5. Комната -->
            <div class="form-group">
                <label for="room">Комната *</label>
                <input type="text" id="room" required maxlength="10">
            </div>

            <!-- 6. Срок заселения -->
            <div class="form-group">
                <label for="accommodationPeriod">Срок заселения *</label>
                <input type="date" id="accommodationPeriod" required>
            </div>

            <!-- 7. Иностранец -->
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isForeigner"> Является иностранным студентом
                </label>
            </div>

            <!-- 8. Заметки -->
            <div class="form-group">
                <label for="notes">Заметки</label>
                <textarea id="notes" rows="3" maxlength="300"></textarea>
            </div>

            <!-- Validation Error Box -->
            <div id="validationErrors" class="error-msg"></div>

            <button type="submit" class="btn">Сохранить</button>
            <a href="index.html" class="btn btn-danger">Отмена</a>
        </form>
    </div>

    <!-- Issue 7 -->
    <script type="module" src="js/ui-form.js"></script>
</body>
</html>
