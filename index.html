<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        table, th, td {
            border: 1px solid black; 
            border-collapse: collapse; 
            padding: 10px; 
        }
        
    </style>


</head>
<body>

    <table>

        <thead>

        <tr>
            <th>Full Name</th>
            <th>Group</th>
            <th>ISU Number</th>
            <th>Room Number</th>
            <th>Procedures</th>
        </tr>

        </thead>

        <tbody id="student-body">


        </tbody>
    

    </table>

    <div id="student-dossier" style="display: none; margin-top: 20px; border: 1px solid #000; padding: 15px;">
        <h3>Student Dossier</h3>
        <p><strong>Full Name:</strong> <span id="dossier-name"></span></p>
        <p><strong>Group:</strong> <span id="dossier-group"></span></p>
        <p><strong>ISU Number:</strong> <span id="dossier-isu"></span></p>
        <p><strong>Room Number:</strong> <span id="dossier-room"></span></p>
        <button id="close-dossier-btn" onclick="closeDossier()">Close</button>
    </div>

    <script src="script.js"> </script>

</body>
</html>
